name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "crates/**"
      - "README.md"
      - "PORTING.md"
      - "BENCHMARKS.md"
      - "benchmarks/results.json"
      - "benchmarks/results/**"
      - "benchmarks/summarize.mjs"
      - ".github/actions/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "crates/**"
      - "README.md"
      - "PORTING.md"
      - "BENCHMARKS.md"
      - "benchmarks/results.json"
      - "benchmarks/results/**"
      - "benchmarks/summarize.mjs"
      - ".github/actions/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Starlight Site & Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs-rustdoc
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Rustdoc API documentation
        env:
          RUSTDOCFLAGS: >-
            -D warnings
            -D rustdoc::broken-intra-doc-links
            -D rustdoc::invalid-codeblock-attributes
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@composable-delivery"

      - name: Install Starlight site dependencies
        run: npm --prefix site ci --ignore-scripts

      - name: Build Astro Starlight site
        env:
          ASTRO_SITE: https://${{ github.repository_owner }}.github.io
          ASTRO_BASE: /${{ github.event.repository.name }}
        run: npm --prefix site run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

