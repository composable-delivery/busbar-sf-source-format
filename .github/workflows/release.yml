name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name to release (e.g. v0.0.1)
        required: false
        default: "v0.0.1"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-linux:
    name: Build Linux CLI (x86_64 for GitHub Actions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build CLI binary
        run: |
          cargo build -p busbar-sf-source-format --bin sf-source-format --features cli --release --target x86_64-unknown-linux-gnu --locked
      - name: Package Linux archive
        run: |
          mkdir -p dist
          BIN="target/x86_64-unknown-linux-gnu/release/sf-source-format"
          chmod +x "$BIN"
          tar -czf dist/sf-source-format-linux-x86_64.tar.gz \
            -C "target/x86_64-unknown-linux-gnu/release" sf-source-format \
            -C "${{ github.workspace }}" README.md LICENSE-MIT LICENSE-APACHE
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/*
          retention-days: 7

  build-macos:
    name: Build macOS CLI (Universal Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build -p busbar-sf-source-format --bin sf-source-format --features cli --release --target aarch64-apple-darwin --locked
          cargo build -p busbar-sf-source-format --bin sf-source-format --features cli --release --target x86_64-apple-darwin --locked
      - name: Create Universal macOS binary via lipo & package
        run: |
          mkdir -p dist universal
          lipo -create \
            target/aarch64-apple-darwin/release/sf-source-format \
            target/x86_64-apple-darwin/release/sf-source-format \
            -output universal/sf-source-format
          chmod +x universal/sf-source-format
          lipo -info universal/sf-source-format
          tar -czf dist/sf-source-format-macos-universal.tar.gz \
            -C universal sf-source-format \
            -C "${{ github.workspace }}" README.md LICENSE-MIT LICENSE-APACHE
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/*
          retention-days: 7

  build-windows:
    name: Build Windows CLI (x86_64 for local installs)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build CLI binary
        run: |
          cargo build -p busbar-sf-source-format --bin sf-source-format --features cli --release --target x86_64-pc-windows-msvc --locked
      - name: Package Windows archive
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/sf-source-format.exe dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          cd dist
          7z a sf-source-format-windows-x86_64.zip sf-source-format.exe README.md LICENSE-MIT LICENSE-APACHE
          rm sf-source-format.exe README.md LICENSE-MIT LICENSE-APACHE
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/*
          retention-days: 7

  attest-and-publish:
    name: Attest & Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    steps:
      - uses: actions/checkout@v7

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Prepare release assets & SHA256SUMS
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/* release-assets/
          cd release-assets
          shasum -a 256 * > SHA256SUMS.txt
          ls -la

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release-assets/*"

      - name: Determine tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag_name || 'v0.0.1' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          files: release-assets/*
          prerelease: true
          generate_release_notes: true
          draft: false
