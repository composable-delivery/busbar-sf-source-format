[package]
name = "busbar-sf-source-format"
description = "Salesforce MDAPI to SFDX source format decomposition, recomposition, registry, tree, XML engine, and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["salesforce", "sfdx", "mdapi", "metadata", "cli"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]

[[bin]]
name = "sf-source-format"
path = "src/main.rs"
required-features = ["cli"]
doc = false

[[test]]
name = "cli_integration"
required-features = ["cli"]

[dependencies]
anyhow = { workspace = true, optional = true }
blake3.workspace = true
clap = { workspace = true, optional = true }
feruca.workspace = true
globset.workspace = true
ignore.workspace = true
indexmap.workspace = true
mime_guess.workspace = true
quick-xml.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
walkdir.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
criterion.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[[bench]]
name = "convert_bench"
harness = false

[lints]
workspace = true
